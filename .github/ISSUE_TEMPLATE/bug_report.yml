# Fiscal convention: monetary values in the Drenyra ecosystem are BigInt cents;
# no float is ever used for money; version numbers are JSON integers, never floats.
name: Bug report
description: Report a defect in an ARKELYTHEX repository
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fiscal paths (money math, RUC/period isolation, SUNAT, receipts, ledger) are high sensitivity — be precise.
        Never include customer data, credentials, or real fiscal amounts in this report.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact of the defect.
      options:
        - Critical (fiscal correctness risk / blocks release)
        - High (major functionality broken)
        - Medium (partial functionality broken)
        - Low (cosmetic / minor)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Affected repository or area.
      options:
        - drenyra-command-center
        - drenyra-ai
        - drenyra-shell
        - drenyra-engram
        - drenyra-skills
        - drenyra-guardian-angel
        - .github
        - Other
    validations:
      required: true
  - type: input
    id: ruc_scope
    attributes:
      label: Fiscal scope — masked RUC (when applicable)
      description: Provide only a non-identifying placeholder or masked suffix; never include a full RUC or customer identifier.
      placeholder: "e.g. RUC-***-789 or TEST-RUC"
  - type: input
    id: period
    attributes:
      label: Fiscal scope — period (when applicable)
      description: Accounting period affected, YYYY-MM, if applicable.
      placeholder: "e.g. 2026-06"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, sanitized steps. For monetary behavior, use synthetic integer examples only (BigInt cents); never include real fiscal amounts.
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen. If monetary behavior is relevant, use synthetic integer examples in cents only; never include real fiscal amounts.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment versions
      description: OS, runtime, package version, CLI version. Version numbers are JSON integers, never floats.
      placeholder: "OS: | Node: | drenyra-ai: 0.1.0 | CLI:"
